<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />

        <!-- Bootstrap CSS v5.3.8 -->

            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

                    <img src="https://www.shutterstock.com/image-photo/sun-sets-behind-mountain-ranges-600nw-2479236003.jpg" class="w-100 d-block" style="height: 80vh; object-fit: cover;" alt="">

                </div>
                <div class="carousel-item">

                    <div class="carousel-caption">
                        <h4>Slide 3</h4>
                        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. <br> Pariatur, esse!</p>
                    </div>
                </div>
            </div>
            <button type="button" class="carousel-control-prev" data-bs-target="#carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Prev</span>
            </button>
            <button type="button" class="carousel-control-next" data-bs-target="#carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
